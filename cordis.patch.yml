# dsh-token-usage-plugin bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile web add dsh-token-usage-plugin` (or a local `link:`
# path).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (usage aggregation, /tusage/api routes), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/dsh-token-usage-plugin/client.js)
# load in the web GUI.
- insert:
    - id: dsh-token-usage-plugin
      name: 'dsh-token-usage-plugin'
